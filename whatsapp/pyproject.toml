[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam aspas curvas e travessões de propósito

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
